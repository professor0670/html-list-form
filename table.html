<html>
    <head>
        <title>Table implementation</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="flex">
        <h2>This webpage demonstrates table tags</h2>
        <main>
            <table border="2">
                <thead >
                    <tr>
                        <th>Superhero</th>
                        <th>Real name</th>
                        <th>Power</th>
                        <th>Alignment</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Superman</td>
                        <td>Clark Kent</td>
                        <td>Speed, Strength</td>
                        <td>Hero</td>
                    </tr>
                    <tr>
                        <td>Spiderman</td>
                        <td>Peter Parker</td>
                        <td>Web shooting, Hyper activeness</td>
                        <td>Hero</td>
                    </tr>
                    <tr>
                        <td>Moon Knight</td>
                        <td>Marc Spector</td>
                        <td>Hyper Strength</td>
                        <td>Anti-hero</td>
                    </tr>
                    <tr>
                        <td>Thor</td>
                        <td>Thor Odisson</td>
                        <td>Hammer that can do anything</td>
                        <td>Hero</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
