<html>
    <head>
        <title>Form implementation</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="flex" style="background-color: white; color: black;">
        <h2>Please fill the form below</h2>
        <main class="flex">
            Name:<input type="text" name="username" placeholder="Enter your name"> 
            Email:<input type="email" name="user_email" placeholder="abc@gmail.com">
            Address: <input type="text" name="user_address">
             <div>
            Gender:
            Male<input type="radio" name="gender" value="male"> 
            Female<input type="radio" name="gender" value="Female">
            </div>
           <div> Are you drunk?<input type="checkbox">  </div>
            Submit: <button>Submit</button>
        </main>
    </body>
</html>
